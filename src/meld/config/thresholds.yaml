# MELD merge decision-procedure thresholds (tracked DEFAULT).
#
# These are CALIBRATED, not derived (honest-scope line 4): experiment M-2
# calibrates theta_merge / sigma_lo on a held-out claim-pair set and writes the
# calibrated values to a SEPARATE gitignored config under data/ -- never back to
# this tracked default. This file is the documented starting point + the schema.
#
# No silent defaults: the loader requires every key to be present here; a
# missing key is an error, not a fallback.

# sigma (dense cosine) gate for MERGE: at/above this, two claim texts are
# "same enough" provided non-contradiction + Context compatibility also hold.
theta_merge: 0.85

# sigma floor for RELATE: between sigma_lo and theta_merge the claims are
# related (overlaps), not identical.
sigma_lo: 0.55

# retention floor R_min for the wire admission (REJECT) gate: a delta whose
# staleness-augmented retention falls below this is stale and never propagates.
r_min: 0.10

# tau: NPS content-matching embedding-similarity threshold (transport routing).
# Used by the sync binding; recorded here so the routing key threshold is not a
# hidden constant. (Sync layer is a later phase; kept for schema completeness.)
tau: 0.50
